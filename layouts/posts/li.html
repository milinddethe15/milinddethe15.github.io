<li class="post-list-item">
  <a class="title" href="{{ .Params.externalLink | default .RelPermalink }}">{{ .Title }}</a>
  <div class="post-list-meta">
    <span class="date">{{ .Date | time.Format (.Site.Params.dateFormat | default "January 2, 2006" ) }}</span>
    {{- range $index, $tag := .GetTerms "tags" }}
      {{- if gt $index 0 }}<span class="sep">·</span>{{ end }}
      <a href="{{ $tag.RelPermalink }}" class="post-list-tag">{{ $tag.LinkTitle }}</a>
    {{- end }}
  </div>
</li>
